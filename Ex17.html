<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Responsive Layout Demo</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fafafa;
  }

  header {
    background: #4a90e2;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
  }

  .box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    min-height: 200px;
  }

  @media (max-width: 800px) {
    .container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <header>Responsive Web Page</header>

  <div class="container">
    <div class="box">Content Block 1</div>
    <div class="box">Content Block 2</div>
  </div>
</body>
</html>
