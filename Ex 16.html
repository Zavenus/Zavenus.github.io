<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSS Transition Squares</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
    gap: 40px;
    font-family: Arial;
  }

  .square {
    width: 150px;
    height: 150px;
    background: skyblue;
    transition: all 0.4s ease;
  }

  .square:hover {
    border-radius: 30%;
    background: steelblue;
    transform: rotate(20deg) scale(1.1);
  }

  .square2 {
    width: 150px;
    height: 150px;
    background: lightcoral;
    transition: all 0.5s ease;
  }

  .square2:hover {
    border-radius: 50%;
    background: crimson;
    transform: scale(1.2);
  }
</style>
</head>
<body>
  <div class="square"></div>
  <div class="square2"></div>
</body>
</html>
